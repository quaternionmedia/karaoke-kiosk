[project]
name = "karaoke-kiosk"
version = "0.1.0"
description = "Karaoke Kiosk manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.138.0",
    "sqlmodel>=0.0.38",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.19",
    "uvicorn>=0.49.0",
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
