<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karaoke Kiosk</title>
  <script src="https://unpkg.com/mithril@2.2.2/mithril.js"></script>
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d1a;
      --surface:     #16162a;
      --card:        #1e1e38;
      --border:      #2e2e55;
      --accent:      #c026d3;       /* magenta */
      --accent2:     #7c3aed;       /* violet  */
      --gold:        #f59e0b;
      --text:        #f0f0ff;
      --muted:       #9090b8;
      --danger:      #ef4444;
      --success:     #22c55e;
      --radius:      14px;
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;          /* kiosk: no scroll */
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Shared Utilities ──────────────────────────────────────────── */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .85rem 2rem;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: default; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(192,38,211,.35);
    }
    .btn-primary:not(:disabled):hover {
      box-shadow: 0 6px 28px rgba(192,38,211,.55);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    .btn-lg { padding: 1.1rem 2.8rem; font-size: 1.2rem; }
    .btn-sm { padding: .55rem 1.2rem; font-size: .85rem; }

    .label {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .45rem;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: .85rem 1.1rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    .tag {
      display: inline-block;
      padding: .2rem .65rem;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    /* ── Glowing Logo Text ─────────────────────────────────────────── */
    .logo-text {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 10%, var(--accent) 50%, var(--gold) 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px rgba(192,38,211,.5));
      line-height: 1;
    }

    .logo-sub {
      font-size: clamp(.9rem, 2vw, 1.15rem);
      color: var(--muted);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-top: .6rem;
    }

    /* ── Splash ────────────────────────────────────────────────────── */
    .splash-wrap {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .splash-icon {
      font-size: 5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(192,38,211,.6));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .venue-message {
      max-width: 540px;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.6); opacity: .4; }
    }

    .splash-cta { margin-top: 1rem; }

    /* ── Search ────────────────────────────────────────────────────── */
    .search-screen {
      width: 100%;
      max-width: 720px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .search-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .search-bar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
    }
    .search-bar-wrap input {
      padding-left: 2.8rem;
      font-size: 1.1rem;
    }

    .genre-filters {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .genre-btn {
      padding: .4rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .genre-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: #fff;
    }
    .genre-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }

    .song-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      padding-right: .25rem;
    }

    .song-list::-webkit-scrollbar { width: 5px; }
    .song-list::-webkit-scrollbar-track { background: transparent; }
    .song-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .song-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .85rem 1.1rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .song-card:hover {
      border-color: var(--accent);
      transform: translateX(4px);
      box-shadow: 0 0 18px rgba(192,38,211,.18);
    }

    .song-num {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }

    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: .82rem;
      color: var(--muted);
      margin-top: .15rem;
    }

    .song-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .3rem;
      flex-shrink: 0;
    }

    .song-duration {
      font-size: .8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .genre-tag {
      font-size: .65rem;
      font-weight: 700;
      padding: .15rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .no-results {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .no-results .emoji { font-size: 2.5rem; }

    /* ── User Info ─────────────────────────────────────────────────── */
    .info-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 2.25rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .selected-song-banner {
      display: flex;
      align-items: center;
      gap: .85rem;
      padding: .85rem 1.1rem;
      background: var(--card);
      border-radius: var(--radius);
      border-left: 3px solid var(--accent);
    }
    .ssb-icon { font-size: 1.5rem; }
    .ssb-title { font-size: .95rem; font-weight: 700; }
    .ssb-artist { font-size: .8rem; color: var(--muted); }

    .field { display: flex; flex-direction: column; gap: .4rem; }

    .optional-badge {
      display: inline-block;
      margin-left: .45rem;
      font-size: .68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .form-actions {
      display: flex;
      gap: .75rem;
      margin-top: .25rem;
    }
    .form-actions .btn { flex: 1; justify-content: center; }

    .privacy-note {
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Countdown ─────────────────────────────────────────────────── */
    .countdown-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
    }

    .countdown-number {
      font-size: clamp(7rem, 22vw, 13rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: countPop .5s cubic-bezier(.34,1.56,.64,1);
      filter: drop-shadow(0 0 40px rgba(192,38,211,.6));
    }
    @keyframes countPop {
      from { transform: scale(1.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .countdown-label {
      font-size: 1.3rem;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .countdown-song {
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 700;
    }
    .countdown-artist { color: var(--muted); font-weight: 400; margin-left: .3rem; }

    /* ── Playback ──────────────────────────────────────────────────── */
    .playback-wrap {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      align-items: center;
    }

    .now-playing-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .rec-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--danger);
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .stage-display {
      width: 100%;
      aspect-ratio: 16/7;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .stage-display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(192,38,211,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .stage-placeholder {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 20px rgba(192,38,211,.5));
      animation: float 3s ease-in-out infinite;
    }

    .stage-api-note {
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
      max-width: 340px;
      line-height: 1.6;
    }
    .stage-api-badge {
      display: inline-block;
      padding: .25rem .75rem;
      border-radius: 999px;
      background: rgba(192,38,211,.15);
      border: 1px solid rgba(192,38,211,.3);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 36px;
    }
    .waveform span {
      width: 4px;
      border-radius: 99px;
      background: var(--accent);
      animation: wave 1.2s ease-in-out infinite;
    }
    .waveform span:nth-child(2) { animation-delay: .1s; }
    .waveform span:nth-child(3) { animation-delay: .2s; }
    .waveform span:nth-child(4) { animation-delay: .3s; }
    .waveform span:nth-child(5) { animation-delay: .4s; }
    .waveform span:nth-child(6) { animation-delay: .3s; }
    .waveform span:nth-child(7) { animation-delay: .2s; }
    .waveform span:nth-child(8) { animation-delay: .1s; }
    @keyframes wave {
      0%, 100% { height: 6px;  opacity: .5; }
      50%       { height: 32px; opacity: 1; }
    }

    .playback-info {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .pb-song { font-size: 1.1rem; font-weight: 800; }
    .pb-artist { font-size: .85rem; color: var(--muted); }
    .pb-singer { font-size: .85rem; color: var(--accent); font-weight: 600; }

    .progress-bar-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width .8s linear;
    }

    .playback-controls {
      display: flex;
      gap: .75rem;
      align-items: center;
    }

    /* ── Thank You ─────────────────────────────────────────────────── */
    .thankyou-wrap {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .confetti-icon {
      font-size: 5rem;
      animation: spin 1s ease-out 1, float 3s ease-in-out infinite 1s;
    }
    @keyframes spin {
      from { transform: rotate(-30deg) scale(.5); opacity: 0; }
      to   { transform: rotate(0deg)  scale(1);  opacity: 1; }
    }

    .thankyou-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .thankyou-sub {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 420px;
    }

    .thankyou-name {
      color: var(--text);
      font-weight: 700;
    }

    .restart-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .6rem 1.4rem;
      font-size: .85rem;
      color: var(--muted);
    }

    /* ── Header Bar (visible on some screens) ──────────────────────── */
    .app-bar {
      flex-shrink: 0;
      height: 56px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(13,13,26,.85);
      backdrop-filter: blur(10px);
    }

    .app-bar-logo {
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .step-indicator {
      display: flex;
      gap: .5rem;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background .3s;
    }
    .step-dot.active { background: var(--accent); }
    .step-dot.done   { background: var(--accent2); }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  CONFIG — edit these to customise the kiosk
// ════════════════════════════════════════════════════════════════════
const CONFIG = {
  venueName:    "Neon Nights Karaoke",

  splashDelay:  3500,      // ms before "tap to start" prompt appears
  countdownFrom: 3,        // countdown seconds before playback
  thankYouDuration: 5000,  // ms on thank-you screen before restart
};

// ════════════════════════════════════════════════════════════════════
//  API HOOKS — wire these up to your REST endpoints
// ════════════════════════════════════════════════════════════════════
const API = {
  /**
   * Search the song catalogue.
   * @param {string} query  - user search text
   * @param {string} genre  - genre filter (or "All")
   * @returns {Promise<Array>} - array of song objects
   */
  searchSongs(query, genre) {
    // TODO: replace stub with → fetch(`/api/songs?q=${encodeURIComponent(query)}&genre=${genre}`)
    //        .then(r => r.json())
    const q = query.toLowerCase();
    return Promise.resolve(
      SONG_CATALOGUE.filter(s =>
        (genre === "All" || s.genre === genre) &&
        (q === "" || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q))
      )
    );
  },

  /**
   * Start karaoke playback for the selected song.
   * @param {object} song     - song object { id, title, artist, … }
   * @param {object} singer   - { name, email }
   * @returns {Promise<object>} - session info { sessionId, … }
   */

// ════════════════════════════════════════════════════════════════════
//  APP STATE
// ════════════════════════════════════════════════════════════════════
const State = {
  view:        "splash",   // splash | search | userinfo | countdown | playback | thankyou
  song:        null,       // selected song object
  name:        "",
  email:       "",
  sessionId:   null,
  countdown:   CONFIG.countdownFrom,
  progress:    0,          // 0–100 playback progress
  _timers:     [],         // internal timer handles

  clearTimers() {
    this._timers.forEach(clearInterval);
    this._timers = [];
  },

  go(view) {
    this.clearTimers();
    this.view = view;
    m.redraw();
  },
};

//  COMPONENTS

// ── App Bar ────────────────────────────────────────────────────────
const AppBar = {
  view({ attrs: { step } }) {
    const steps = ["search", "userinfo", "countdown", "playback"];
    return m(".app-bar",
      m(".app-bar-logo", "🎤 " + CONFIG.venueName),
      m(".step-indicator",
        steps.map((s, i) =>
          m(".step-dot", {
            class: s === step ? "active"
                 : steps.indexOf(step) > i ? "done" : ""
          })
        )
      )
    );
  }
};

// ── Splash Screen ──────────────────────────────────────────────────
const SplashScreen = {
  ready: false,
  oninit() {
    SplashScreen.ready = false;
    const t = setTimeout(() => {
      SplashScreen.ready = true;
      m.redraw();
    }, CONFIG.splashDelay);
    State._timers.push(t);
  },
  view() {
    return m(".screen",
      m(".splash-wrap",
        m(".splash-icon", "🎤"),
        m(".logo-text", CONFIG.venueName),
        m(".logo-sub", "Karaoke Kiosk"),
        m("p.venue-message", CONFIG.venueMessage),
        SplashScreen.ready
          ? m(".splash-cta",
              m("button.btn.btn-primary.btn-lg",
                { onclick: () => State.go("search") },
                "✨ Choose a Song"

              m("span", { style: "color:var(--muted);font-size:.9rem;" },
                m(".pulse-dot"), " Loading…"

            )

};

// ── Song Search ────────────────────────────────────────────────────
const SongSearch = {
  query:   "",
  genre:   "All",
  results: [...SONG_CATALOGUE],
  loading: false,

  oninit() {
    SongSearch.query   = "";
    SongSearch.genre   = "All";
    SongSearch.results = [...SONG_CATALOGUE];
    SongSearch.loading = false;
  },

  doSearch() {
    SongSearch.loading = true;
    API.searchSongs(SongSearch.query, SongSearch.genre).then(results => {
      SongSearch.results = results;
      SongSearch.loading = false;
      m.redraw();
    });
  },

  selectSong(song) {
    State.song  = song;
    State.name  = "";
    State.email = "";
    State.go("userinfo");
  },

  view() {
    const { query, genre, results, loading } = SongSearch;
    return [
      m(AppBar, { step: "search" }),
      m(".screen", { style: "padding-top:1rem;padding-bottom:1rem;" },
        m(".search-screen",

          m(".search-header",
            m("h2", "🎵 Pick Your Song"),
            m("span", { style: "color:var(--muted);font-size:.9rem;" },
              results.length + " available"
            )
          ),

          // Search bar
          m(".search-bar-wrap",
            m("span.search-icon", "🔍"),
            m("input[type=text]", {
              placeholder: "Search title or artist…",
              value: query,
              oninput(e) {
                SongSearch.query = e.target.value;
                SongSearch.doSearch();
              }

          ),

          // Genre filters
          m(".genre-filters",

// ── Countdown ──────────────────────────────────────────────────────
const CountdownScreen = {
  current: CONFIG.countdownFrom,
  key: CONFIG.countdownFrom,   // force animation re-trigger

  oninit() {
    CountdownScreen.current = CONFIG.countdownFrom;
    CountdownScreen.key     = CONFIG.countdownFrom;

    const t = setInterval(() => {
      CountdownScreen.current--;
      CountdownScreen.key = CountdownScreen.current;

      if (CountdownScreen.current <= 0) {
        clearInterval(t);
        CountdownScreen._startPlayback();
      }
      m.redraw();
    }, 1000);
    State._timers.push(t);
  },

  _startPlayback() {
    API.startPlayback(State.song, { name: State.name, email: State.email })
      .then(session => {
        State.sessionId = session.sessionId;
        State.progress  = 0;
        State.go("playback");
      });
  },

  view() {
    const n = CountdownScreen.current;
    return [
      m(AppBar, { step: "countdown" }),
      m(".screen",
        m(".countdown-wrap",
          m(".countdown-label", "Get ready,  " + State.name + "!"),
          n > 0
            ? m(".countdown-number", { key: CountdownScreen.key }, n)
            : m(".countdown-number", { style: "font-size:clamp(3rem,10vw,6rem);" }, "GO! 🎤"),
          m("p.countdown-song",
            "🎵 ", song => song,   // just a spacer
            m("span", State.song.title),
            m("span.countdown-artist", "— " + State.song.artist)
          )
        )
      )
    ];
  }
};

// tiny helper referenced inside countdown view
CountdownScreen.view = function() {
  const n = CountdownScreen.current;
  return [
    m(AppBar, { step: "countdown" }),
    m(".screen",
      m(".countdown-wrap",
        m(".countdown-label", "Get ready,  " + State.name + "!"),
        n > 0
          ? m(".countdown-number", { key: CountdownScreen.key }, n)
          : m(".countdown-number",
              { style: "font-size:clamp(3rem,10vw,7rem);letter-spacing:-.01em;" },
              "GO! 🎤"
            ),
        m("p.countdown-song",
          m("span", State.song.title),
          m("span.countdown-artist", " — " + State.song.artist)
        )
      )
    )
  ];
};

// ── Playback / Recording ───────────────────────────────────────────
const PlaybackScreen = {
  elapsed: 0,           // seconds elapsed
  totalSec: 0,
  waveHeights: Array(8).fill(0).map(() => Math.random()),

  oninit() {
    PlaybackScreen.elapsed   = 0;
    PlaybackScreen.totalSec  = PlaybackScreen._parseDuration(State.song.duration);
    State.progress = 0;

    // Animate waveform heights
    const wt = setInterval(() => {
      PlaybackScreen.waveHeights = PlaybackScreen.waveHeights.map(() =>
        6 + Math.random() * 26
      );
      m.redraw();
    }, 180);

    // Progress tick
    const pt = setInterval(() => {
      PlaybackScreen.elapsed++;
      State.progress = Math.min(
        100,
        (PlaybackScreen.elapsed / PlaybackScreen.totalSec) * 100
      );
      if (State.progress >= 100) {
        clearInterval(pt);
        clearInterval(wt);
        PlaybackScreen._finish();
      }
      m.redraw();
    }, 1000);

    State._timers.push(wt, pt);
  },

  _parseDuration(str) {
    const [m, s] = str.split(":").map(Number);
    return m * 60 + s;
  },

  _fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  },

  _finish() {
    API.stopPlayback(State.sessionId).then(() => {
      if (State.email) API.submitEmail(State.email, State.sessionId);
      State.go("thankyou");
    });
  },

  view() {
    const { elapsed, totalSec, waveHeights } = PlaybackScreen;
    const remaining = Math.max(0, totalSec - elapsed);

    return [
      m(AppBar, { step: "playback" }),
      m(".screen", { style: "padding-top:1rem;" },
        m(".playback-wrap",

          // Now playing badge
          m(".now-playing-header",
            m(".rec-dot"), "Now Performing"
          ),

          // Stage (video/lyrics placeholder)
          m(".stage-display",
            m(".stage-placeholder", "🎬"),
            m("span.stage-api-badge", "Playback API"),
            m(".stage-api-note",
              "Lyrics & video will render here via your playback API. ",
              "Hook ", m("code", { style: "color:var(--accent);" }, "API.startPlayback()"),
              " to stream content."
            )
          ),

          // Song + singer info
          m(".playback-info",
            m("div",
              m(".pb-song",  State.song.title),
              m(".pb-artist",State.song.artist),
              m(".pb-singer","🎤 " + State.name)
            ),
            // Live waveform
            m(".waveform",
              waveHeights.map((h, i) =>
                m("span", { key: i, style: `height:${h}px;` })
              )
            )
          ),

          // Progress bar
          m(".progress-bar-wrap",
            m(".progress-times",
              m("span", PlaybackScreen._fmt(elapsed)),
              m("span", "−" + PlaybackScreen._fmt(remaining))
            ),
            m(".progress-track",
              m(".progress-fill", { style: `width:${State.progress}%` })
            )
          ),

          // Controls
          m(".playback-controls",
            m("button.btn.btn-ghost.btn-sm",
              {
                title: "Stop early",
                onclick() { State.clearTimers(); PlaybackScreen._finish(); }
              },
              "⏹ Finish Early"
            )
          )
        )
      )
    ];
  }
};

            ? "We'll send your recording to " + State.email + " shortly! 📧"

// ════════════════════════════════════════════════════════════════════
//  ROOT COMPONENT  — state-machine router
// ════════════════════════════════════════════════════════════════════
const App = {
  view() {
    switch (State.view) {
      case "splash":    return m(SplashScreen);
      case "search":    return m(SongSearch);
      case "userinfo":  return m(UserInfoForm);
      case "countdown": return m(CountdownScreen);
      case "playback":  return m(PlaybackScreen);
      case "thankyou":  return m(ThankYouScreen);
      default:          return m(SplashScreen);
    }
  }
};

// ════════════════════════════════════════════════════════════════════
//  MOUNT
// ════════════════════════════════════════════════════════════════════
m.mount(document.getElementById("app"), App);
